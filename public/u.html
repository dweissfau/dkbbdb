<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dkbbdb</title>
<meta name="description" content="A DraftKings best ball portfolio on dkbbdb: every team's league place, cut line and points, and player exposure, scored live from public NFL stats.">
<meta property="og:image" content="https://dkbbdb.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="bar">
  <span class="brand">dkbbdb</span>
</div>
<main class="profile">
  <header class="who">
    <div>
      <h1 id="name">&nbsp;</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span class="note" id="liveNote"></span>
  </header>
  <div class="tiles" id="tiles"></div>

  <div class="panel" id="panel">
    <div class="head">
      <div class="pills" id="tabs" role="tablist">
        <button class="pill on" data-tab="teams" role="tab">Teams</button>
        <button class="pill" data-tab="exposure" role="tab">Exposure</button>
      </div>
      <button class="btn" id="filterBtn" aria-label="Filters and sort" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
      <!-- on desktop these sit inline in the head; on a phone they are a sheet opened by the funnel button -->
      <div class="veil" id="toolsVeil" hidden></div>
      <div class="tools" id="tools">
        <div class="sheethead"><b>Filters</b><button class="btn" id="toolsDone" type="button">Done</button></div>
        <select id="fT" aria-label="Tournament"><option value="">All tournaments</option></select>
        <form class="find" id="fP" autocomplete="off">
          <input type="search" placeholder="Teams with a player…" aria-label="Player" spellcheck="false">
          <div class="hits" hidden></div>
        </form>
        <!-- Exposure tab: a plain search box that narrows the player list by name or NFL team as you type -->
        <form class="find" id="fQ" autocomplete="off" hidden>
          <input type="search" placeholder="Player or team (e.g. Jets)…" aria-label="Player or team" spellcheck="false">
        </form>
        <div class="pills" id="posPills" hidden>
          <button class="pill mini on" data-pos="">All</button><button class="pill mini" data-pos="QB">QB</button><button class="pill mini" data-pos="RB">RB</button><button class="pill mini" data-pos="WR">WR</button><button class="pill mini" data-pos="TE">TE</button>
        </div>
        <label class="check" id="advWrap"><input type="checkbox" id="advOnly"> Advancing only</label>
        <!-- ticked teams (the boxes on the Teams rows): shown once anything is ticked, on both tabs -->
        <div class="pills" id="tickPills" hidden title="Tick teams on the Teams tab, then see only those teams — or everything but them — on both tabs">
          <button class="pill mini on" data-tick-mode="">All teams</button><button class="pill mini" data-tick-mode="only">Only ticked</button><button class="pill mini" data-tick-mode="hide">Hide ticked</button>
        </div>
        <label class="sortwrap" id="sortWrap">Sort by <select id="fS" aria-label="Sort by"></select></label>
      </div>
      <div class="spacer"></div>
      <span class="note" id="count"></span>
    </div>
    <div class="active" id="active" hidden></div>
    <div class="scroll-x">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="rows"><tr><td class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="more" id="more" hidden><button class="btn" id="moreBtn">Show more</button></div>
  </div>
  <footer>Independent tool — not affiliated with, endorsed by, or sponsored by DraftKings. DraftKings is a trademark of its owner. · <a href="/privacy">Privacy</a><span id="forget" hidden> · dkbbdb.com opens this page in this browser · <a href="/#add" id="forgetLink">forget that</a></span></footer>
</main>
<script src="/site.js"></script>
<script>
// One DraftKings account's page: /u/<username>. Everything comes from /api/leaderboard filtered to that username
// (the same scoring as every other page), so the numbers here match the team pop-up to the cent.
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pts = (n) => n == null ? "—" : Number(n).toFixed(2); // DraftKings shows fantasy points to the cent
  const pct = (a, b) => b ? `${(100 * a / b).toFixed(1)}%` : "—";
  const pc1 = (v) => v == null ? "—" : `${Number(v).toFixed(1)}%`;
  const money = (n) => n == null ? "—" : "$" + Number(n).toLocaleString();
  const day = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "—";
  const agoTxt = (iso) => { const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`; };
  const plural = (n, w) => `${Number(n).toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
  const posTag = (p) => `<b class="pos ${esc(p)}">${esc(p)}</b>`;
  const LOGO_ABBR = { WAS: "wsh" };
  const logo = (team) => { const t = String(team ?? "").toUpperCase(); return /^[A-Z]{2,3}$/.test(t) && t !== "FA" && t !== "TBD"
    ? `<img class="tlogo" src="https://a.espncdn.com/i/teamlogos/nfl/500/${LOGO_ABBR[t] ?? t.toLowerCase()}.png" alt="${esc(t)}" title="${esc(t)}" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<span class="tlogo"></span>`; };
  const PAGE = 100;

  const who = decodeURIComponent((/^\/u\/([^/]+)/.exec(location.pathname) ?? [])[1] ?? "").split(",")[0].trim();
  if (!who) { location.replace("/"); return; }
  $("name").textContent = who; document.title = `${who} · dkbbdb`;
  // arriving from the extension (/?u=<name> → here with ?u=): this is the visitor's own account — the home page links back to it
  if ((new URLSearchParams(location.search).get("u") ?? "").trim().toLowerCase() === who.toLowerCase()) { try { localStorage.setItem("dkbbdb-me", who); } catch { /* private window */ } }
  const remember = (name) => { try { localStorage.setItem("dkbbdb-me", name); } catch { /* private window */ } };
  const isMe = () => { try { return (localStorage.getItem("dkbbdb-me") ?? "").toLowerCase() === who.toLowerCase(); } catch { return false; } };

  // the view lives in the address: /u/<name>?tab=exposure &t=tournament &p=playerId[,id…] &adv=1 &pos=QB &q=name &sort=&dir= &team=entryId
  const sp = new URLSearchParams(location.search);
  const F = { tab: sp.get("tab") === "exposure" ? "exposure" : "teams", t: sp.get("t") ?? "", p: sp.get("p") ?? "", adv: sp.get("adv") === "1" ? "1" : "",
    pos: sp.get("pos") ?? "", q: sp.get("q") ?? "", sort: sp.get("sort") ?? "", dir: sp.get("dir") ?? "", team: sp.get("team") ?? "" };
  let data = null, rows = [], shown = PAGE;

  // ticked teams: the boxes on the Teams rows. T.ids = entry ids (strings), T.mode = "" (just marks) | "only" (both tabs
  // show only those teams) | "hide" (both tabs leave them out). Kept per account in this browser, not in the address.
  // Only on the owner's own page (kknox20) — every other account, now or later, gets the plain page with no tick column, no pills.
  const TICKS = who.toLowerCase() === "kknox20";
  if (TICKS) document.body.classList.add("ticks");
  const TICK_KEY = "dkbbdb-ticks:" + who.toLowerCase();
  const T = { ids: new Set(), mode: "" };
  if (TICKS) try { const s = JSON.parse(localStorage.getItem(TICK_KEY) ?? "null"); if (s && Array.isArray(s.ids)) { T.ids = new Set(s.ids.map(String)); T.mode = ["only", "hide"].includes(s.mode) && T.ids.size ? s.mode : ""; } } catch { /* private window */ }
  const saveTicks = () => { try { localStorage.setItem(TICK_KEY, JSON.stringify({ ids: [...T.ids], mode: T.mode })); } catch { /* private window */ } };
  const tickBox = (id) => `<input type="checkbox" class="tick" data-tick="${esc(id)}"${T.ids.has(String(id)) ? " checked" : ""} aria-label="Tick this team">`;
  function tick(ids, on) {
    for (const id of ids) { if (on) T.ids.add(String(id)); else T.ids.delete(String(id)); }
    if (!T.ids.size) T.mode = "";
    saveTicks();
    if (T.mode) load(true); else render(); // the filter changed → ask the server; otherwise just redraw the boxes + chip
  }
  function setTickMode(mode) { T.mode = T.ids.size ? mode : ""; saveTicks(); load(); }

  const gapChip = (t) => t.gap == null ? (t.adv ? `<span class="chip">Advancing</span>` : t.adv === false ? `<span class="chip out">Out</span>` : `<span class="chip wait">Not started</span>`)
    : t.adv ? `<span class="chip" title="points ahead of the best team outside the cut line">Advancing +${pts(t.gap)}</span>`
    : `<span class="chip out" title="points behind the last team inside the cut line">Out by ${pts(-t.gap)}</span>`;
  const place = (t) => t.rank == null ? "—" : `<b>${t.rank}</b><span class="of"> / ${t.entrants ?? "—"}</span>`;
  const L = (long, short) => `<span class="lg">${long}</span><span class="sm">${short}</span>`;
  const shortName = (c) => String(c ?? "").replace(/\s*\[[^\]]*\]/g, "").trim(); // phone: "$20M Millionaire [$3M to 1st]" → "$20M Millionaire"
  // columns per tab: [sort key | null, label, css class, cell html]
  const COLS = {
    teams: [...(TICKS ? [[null, `<input type="checkbox" class="tick" id="tickAll" aria-label="Tick every team in view" title="Tick / untick every team the filters leave">`, "tick", (t) => tickBox(t.id)]] : []),
      [null, "", "rk num", (t) => t.n],
      ["contest", "Tournament", "contest", (t) => `<span class="lg">${esc(t.contest)}</span><span class="sm">${esc(shortName(t.contest))}</span><div class="under"><span class="sm">${t.rank == null ? "no place yet" : `<b>${t.rank}</b>/${t.entrants}`} · </span>${money(t.buyIn)} · ${day(t.date)}</div>`],
      ["rank", L("League place", "Place"), "col-place", place], ["gap", "Cut line", "gap", gapChip],
      ["left", "Left", "num col-left", (t) => t.left ?? "—"], ["points", "Points", "num points", (t) => `<b>${pts(t.points)}</b>`]],
    exposure: [[null, "", "rk num", (r) => r.n], ["name", "Player", "user", (r) => `${posTag(r.pos)} ${logo(r.team)}<span class="pname">${esc(r.name)}</span><div class="under sm">${pc1(r.own)} of teams · ${r.advancing} advancing · pick ${r.avgPick == null ? "—" : Number(r.avgPick).toFixed(1)}</div>`],
      ["buyIn", "Entry fees", "num points", (r) => `<b>${money(r.buyIn)}</b>`], ["own", L("Exposure", "Exp"), "num col-own", (r) => pc1(r.own)], ["advancing", "Advancing", "num col-buyin", (r) => r.advancing],
      ["advRate", L("Advance rate", "Adv %"), "num col-left", (r) => pc1(r.advRate)], ["avgPick", "Avg pick", "num col-date", (r) => r.avgPick == null ? "—" : Number(r.avgPick).toFixed(1)]],
  };
  const ASC_FIRST = new Set(["name", "avgPick", "rank", "date", "contest"]);
  // the phone's sort menu (the table header is hidden there): [label, key, dir]
  const SORTS = {
    teams: [["Points", "points", "desc"], ["Cut line", "gap", "desc"], ["Entry fee", "buyIn", "desc"], ["Newest draft", "date", "desc"], ["League place", "rank", "asc"], ["Tournament", "contest", "asc"]],
    exposure: [["Entry fees", "buyIn", "desc"], ["Exposure", "own", "desc"], ["Advance rate", "advRate", "desc"], ["Avg pick", "avgPick", "asc"], ["Name", "name", "asc"]],
  };

  const params = (extra) => { const q = { view: F.tab === "exposure" ? "players" : "teams", u: who, t: F.t, sort: F.sort, dir: F.dir, ...extra };
    if (F.tab === "teams") { q.p = F.p; q.adv = F.adv; } else { q.pos = F.pos; q.q = F.q.trim(); }
    if (T.mode && T.ids.size) q[T.mode] = [...T.ids].join(",");
    return new URLSearchParams(Object.entries(q).filter(([, v]) => v !== "" && v != null)); };
  // a long ticked list goes as a POST body (the same fields) — an address has a length limit, a body does not
  const req = (extra) => { const p = params(extra), s = p.toString();
    return s.length > 1500 ? fetch("/api/leaderboard", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(Object.fromEntries(p)) }) : fetch("/api/leaderboard?" + s); };
  function pushState() {
    const q = new URLSearchParams(Object.entries(F).filter(([k, v]) => v && !(k === "tab" && v === "teams"))).toString();
    history.replaceState(null, "", "/u/" + encodeURIComponent(who) + (q ? "?" + q : ""));
  }

  function renderHeader(P, sc, f) {
    $("name").textContent = P.user; document.title = `${P.user} · dkbbdb`;
    // the header line and both stats follow the filters: a tournament narrows them to the user's teams in it, chosen
    // players (Teams tab) to the teams that have them within that — `scope` from the API is that set's summary
    const players = F.tab === "teams" && f ? f.p : [];
    const tk = f?.ticks ?? { only: 0, hide: 0 };
    const tickName = T.mode === "only" && tk.only ? `${tk.only} ticked` : T.mode === "hide" && tk.hide ? `all but ${tk.hide} ticked` : "";
    const scopeName = [tickName, F.t ? shortName(F.t) : "", ...players.map((x) => x.name)].filter(Boolean).join(" · ");
    const S = scopeName && sc ? sc : P;
    $("sub").innerHTML = `<span class="lg">DraftKings best ball · </span>` + (scopeName
      ? `<b>${S.teams.toLocaleString()}</b> of ${plural(P.teams, "team")}<span class="lg"> · ${esc(scopeName)}</span>`
      : `${plural(P.teams, "team")}<span class="lg"> in ${plural(P.tournaments.length, "tournament")}</span>`) + ` · NFL week ${data.week}`;
    // stats: [label, value html, detail, css class]. Desktop = a plain strip (number, then "label · detail" under it);
    // phone = two small boxes, no detail, the filters' scope as a small line under the number
    const tg = scopeName ? `<div class="tg sm" title="${esc(scopeName)}">${esc(scopeName)}</div>` : "";
    const ranked = S.advancing + S.out, tiles = [
      ["Advancing", `<span class="good">${S.advancing.toLocaleString()}</span><span class="of"> of ${S.teams.toLocaleString()}</span>${tg}`,
        ranked ? "" : scopeName ? "no league places on these teams yet" : "no league places yet", "t-adv"],
      // Winning = the guaranteed prizes of the teams inside the cut line (next round's minimum), plus anything already
      // credited. A tournament whose payout table is not on file yet shows up in the detail, not in the total.
      // just the word under the number; a missing payout table is only mentioned on hover
      ["Winning", `<span class="good">${money(S.winning)}</span>${tg}`, "", "t-fees",
        S.winUnknown ? `payout table not on file yet for ${plural(S.winUnknown, "advancing team")} — sync again to add it` : ""]];
    $("tiles").innerHTML = tiles.map(([k, v, d, cls, tip]) => `<div class="tile ${cls}"${tip ? ` title="${esc(tip)}"` : ""}><div class="k">${esc(k)}${d ? `<span class="d"> · ${esc(d)}</span>` : ""}</div><div class="v">${v}</div></div>`).join("");
  }

  function render() {
    const cols = COLS[F.tab];
    if (!data?.live) { $("rows").innerHTML = `<tr><td class="empty">Scores are unavailable right now — try again in a minute.</td></tr>`; return; }
    const P = data.profile, f = data.filter, s = data.stats;
    renderHeader(P, data.scope, f);
    if (P.teams && (sp.get("me") === "1" || isMe())) { remember(P.user); $("forget").hidden = false; } // typed on the home page, or already this browser's own page
    if (!P.teams) { // nothing synced under this name
      $("tiles").innerHTML = ""; $("sub").textContent = "";
      $("panel").innerHTML = `<div class="empty">No teams under “${esc(P.user)}” on dkbbdb yet. If that is you, <a href="/">add your teams</a> — it takes about a minute.</div>`;
      return;
    }

    const sel = $("fT");
    sel.replaceChildren(new Option(`All tournaments (${P.teams.toLocaleString()})`, ""), ...P.tournaments.map((t) => new Option(`${t.name} (${t.teams.toLocaleString()})`, t.name)));
    sel.value = F.t;
    for (const b of $("tabs").children) b.classList.toggle("on", b.dataset.tab === F.tab);
    for (const b of $("posPills").children) b.classList.toggle("on", b.dataset.pos === F.pos);
    $("posPills").hidden = F.tab !== "exposure"; $("advWrap").hidden = F.tab !== "teams"; $("advOnly").checked = F.adv === "1"; $("advWrap").classList.toggle("on", F.adv === "1");
    $("panel").classList.toggle("xp", F.tab === "exposure"); // desktop: the sort menu only on Teams (Exposure sorts by its column headers)
    $("fP").hidden = F.tab !== "teams"; $("fQ").hidden = F.tab !== "exposure";
    { const q = $("fQ").querySelector("input"); if (q.value !== F.q && document.activeElement !== q) q.value = F.q; } // a link's ?q=, not the box mid-typing

    // the phone's sort menu mirrors the current sort
    const sorts = SORTS[F.tab];
    $("fS").replaceChildren(...sorts.map(([label, key, dir]) => new Option(label, `${key}:${dir}`)));
    $("fS").value = sorts.some(([, key, dir]) => key === data.sort && dir === data.dir) ? `${data.sort}:${data.dir}` : `${sorts[0][1]}:${sorts[0][2]}`;

    // chosen players (Teams tab): chips + one line of numbers against the teams in view. On a phone the other
    // filters live in the sheet, so they get chips too (and the funnel button a dot) — the table explains itself
    const chips = [];
    const np = F.tab === "teams" ? f.p.length : 0;
    const nq = F.tab === "exposure" ? F.q.trim() : "";
    const filtered = !!(F.t || np || T.mode || (F.tab === "teams" && F.adv === "1") || (F.tab === "exposure" && (F.pos || nq)));
    $("filterBtn").classList.toggle("on", filtered);
    // ticked teams: the mode pills appear once anything is ticked; one chip says how many and what the mode does
    $("tickPills").hidden = !TICKS || !T.ids.size;
    for (const b of $("tickPills").children) b.classList.toggle("on", b.dataset.tickMode === T.mode);
    if (TICKS && T.ids.size) chips.push(`<span class="tag" title="${T.mode === "only" ? "both tabs show only the ticked teams" : T.mode === "hide" ? "both tabs leave the ticked teams out" : "ticks are just marks until you pick “Only ticked” or “Hide ticked”"}">${plural(T.ids.size, "team")} ticked${T.mode === "only" ? " · only these" : T.mode === "hide" ? " · hidden" : ""}<button data-clear="ticks" aria-label="Untick every team">✕</button></span>`);
    if (F.t) chips.push(`<span class="tag sm">${esc(shortName(F.t))}<button data-clear="t" aria-label="All tournaments">✕</button></span>`);
    if (F.tab === "teams" && F.adv === "1") chips.push(`<span class="tag sm">Advancing only<button data-clear="adv" aria-label="Every team">✕</button></span>`);
    if (F.tab === "exposure" && F.pos) chips.push(`<span class="tag sm">${posTag(F.pos)}only<button data-clear="pos" aria-label="Every position">✕</button></span>`);
    if (nq) chips.push(`<span class="tag">“${esc(nq)}”<button data-clear="q" aria-label="Clear the name search">✕</button></span>`);
    if (np) {
      for (const p of f.p) chips.push(`<span class="tag">${posTag(p.pos)}${logo(p.team)}${esc(p.name)}<button data-clear="p" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button></span>`);
      const them = np === 1 ? "him" : np === 2 ? "both" : `all ${np}`;
      chips.push(`<span class="sub"><b>${s.count.toLocaleString()}</b> of ${plural(s.field, "team")}${f.t ? " in this tournament" : ""} have ${them} (${pct(s.count, s.field)}) · <b>${s.advancing.toLocaleString()}</b> advancing${s.ranked ? ` (${pct(s.advancing, s.ranked)}, all teams ${pct(s.fieldAdvancing, s.fieldRanked)})` : ""}${np < 5 ? " · add another player to narrow it down" : ""}</span>`);
    }
    $("active").innerHTML = chips.join(""); $("active").hidden = !chips.length;

    // the Teams tab's count is in the header line already; the Exposure tab's player count sits by the table
    $("count").textContent = F.tab === "teams" ? "" : nq && !data.total ? `nobody matching “${nq}”` : plural(data.total, "player");
    const thClass = (cls) => cls.split(" ").filter((c) => c === "num" || c === "tick" || c.startsWith("col-")).join(" ");
    $("thead").innerHTML = cols.map(([key, label, cls]) => `<th class="${thClass(cls)}${key ? " sortable" : ""}"${key ? ` data-sort="${key}" tabindex="0"` : ""}>${label}${key && data.sort === key ? `<span class="arrow">${data.dir === "asc" ? "▲" : "▼"}</span>` : ""}</th>`).join("");
    const attr = (r) => F.tab === "teams" ? `data-id="${esc(r.id)}"${T.ids.has(String(r.id)) ? ' class="ticked"' : ""}` : `data-player="${r.id}"`;
    $("rows").innerHTML = rows.map((r) => `<tr ${attr(r)} tabindex="0">${cols.map(([, , cls, cell]) => `<td class="${cls}">${cell(r)}</td>`).join("")}</tr>`).join("")
      || `<tr><td colspan="${cols.length}" class="empty">Nothing matches.</td></tr>`;
    const all = $("tickAll");
    if (all) { const n = rows.filter((r) => T.ids.has(String(r.id))).length; all.checked = rows.length > 0 && n === rows.length; all.indeterminate = n > 0 && n < rows.length; }
    $("more").hidden = rows.length >= data.total;
    renderNote();
  }
  function renderNote() {
    if (!data?.at) return;
    $("liveNote").innerHTML = `<span class="live" title="updated ${agoTxt(data.at)}"><span class="dot"></span><span class="lg">${data.playing ? "games on" : "live scoring"} · updated ${agoTxt(data.at)}</span><span class="sm">Live</span></span>`;
  }

  let seq = 0;
  async function load(keepShown = false) {
    if (!keepShown) shown = PAGE;
    const mine = ++seq;
    try {
      const d = await (await req({ offset: 0, limit: Math.min(200, shown) })).json();
      const got = d.rows ?? [];
      while (d.live && got.length < Math.min(shown, d.total)) got.push(...(await (await req({ offset: got.length, limit: 200 })).json()).rows);
      if (mine !== seq) return;
      data = d; rows = got; render();
    } catch { if (!data) $("rows").innerHTML = `<tr><td class="empty">Could not load this page — check your connection.</td></tr>`; }
  }
  const set = (changes) => { Object.assign(F, changes); pushState(); load(); };
  const pids = () => F.p.split(",").filter(Boolean);

  $("fT").addEventListener("change", (e) => set({ t: e.target.value }));
  $("advOnly").addEventListener("change", (e) => set({ adv: e.target.checked ? "1" : "" }));
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b && b.dataset.tab !== F.tab) set({ tab: b.dataset.tab, sort: "", dir: "" }); });
  $("posPills").addEventListener("click", (e) => { const b = e.target.closest("[data-pos]"); if (b) set({ pos: b.dataset.pos }); });
  window.dkbbSuggest($("fP"), "player", (r) => set({ p: [...new Set([...pids(), String(r.id)])].slice(0, 5).join(",") }), { u: who });
  // Exposure tab: typing narrows the player list (a short pause so each keystroke is not a request); Enter just closes the keyboard
  { let timer = 0; const q = $("fQ").querySelector("input");
    q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { if (q.value !== F.q) set({ q: q.value }); }, 220); });
    $("fQ").addEventListener("submit", (e) => { e.preventDefault(); clearTimeout(timer); if (q.value !== F.q) set({ q: q.value }); q.blur(); }); }
  $("active").addEventListener("click", (e) => {
    const b = e.target.closest("[data-clear]"); if (!b) return;
    if (b.dataset.clear === "p") set({ p: pids().filter((id) => id !== b.dataset.id).join(",") });
    else if (b.dataset.clear === "ticks") tick([...T.ids], false);
    else set({ [b.dataset.clear]: "" });
  });
  $("tickPills").addEventListener("click", (e) => { const b = e.target.closest("[data-tick-mode]"); if (b && b.dataset.tickMode !== T.mode) setTickMode(b.dataset.tickMode); });
  // a row's box ticks that team; the header box ticks (or unticks) every team the filters leave — the server sends their ids
  $("rows").addEventListener("change", (e) => { const b = e.target.closest(".tick"); if (b) tick([b.dataset.tick], b.checked); });
  $("thead").addEventListener("change", async (e) => {
    if (e.target.id !== "tickAll") return;
    const on = e.target.checked;
    try { const d = await (await req({ offset: 0, limit: 1, withIds: "1" })).json(); if (d.ids) tick(d.ids, on); } catch { /* the boxes redraw from the next load */ }
  });
  $("fS").addEventListener("change", (e) => { const [sort, dir] = e.target.value.split(":"); set({ sort, dir }); });
  // phone: the filters are a sheet under the funnel button
  const sheet = (open) => { document.body.classList.toggle("tools-open", open); $("toolsVeil").hidden = !open; $("filterBtn").setAttribute("aria-expanded", String(open)); };
  $("filterBtn").addEventListener("click", () => sheet(!document.body.classList.contains("tools-open")));
  $("toolsDone").addEventListener("click", () => sheet(false));
  $("toolsVeil").addEventListener("click", () => sheet(false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") sheet(false); });
  if (location.hash === "#filters") sheet(true);
  $("forgetLink").addEventListener("click", () => { try { localStorage.removeItem("dkbbdb-me"); } catch { /* private window */ } });
  $("moreBtn").addEventListener("click", () => { shown += PAGE; load(true); });
  const sortClick = (th) => { const k = th.dataset.sort; set({ sort: k, dir: data?.sort === k ? (data.dir === "asc" ? "desc" : "asc") : ASC_FIRST.has(k) ? "asc" : "desc" }); };
  $("thead").addEventListener("click", (e) => { const th = e.target.closest("[data-sort]"); if (th) sortClick(th); });
  $("thead").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("[data-sort]")) sortClick(e.target); });

  // a team opens its league view — the pop-up from boot.js in a full-screen frame; ?team= keeps the link shareable
  let frame = null;
  function openTeam(id) {
    closeTeam(false);
    frame = document.createElement("iframe");
    frame.className = "teamframe"; frame.title = "Team"; frame.src = "/team/" + encodeURIComponent(id);
    document.body.appendChild(frame);
    document.documentElement.style.overflow = "hidden";
    F.team = String(id); pushState();
  }
  function closeTeam(update = true) { frame?.remove(); frame = null; document.documentElement.style.overflow = ""; if (update && F.team) { F.team = ""; pushState(); } }
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data?.dkbbdb === "close-team") closeTeam(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTeam(); });
  function rowClick(target) {
    if (target.closest(".tick")) return; // the box ticks the team (its change event); it does not open the pop-up
    const tr = target.closest("tr"); if (!tr) return;
    if (tr.dataset.id) openTeam(tr.dataset.id);
    else if (tr.dataset.player) set({ tab: "teams", p: tr.dataset.player, adv: "", sort: "", dir: "" }); // "Advancing only" is hidden on Exposure, so it is dropped
  }
  $("rows").addEventListener("click", (e) => { if (!e.target.closest("a")) rowClick(e.target); });
  $("rows").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr")) rowClick(e.target); });

  load().then(() => { if (F.team) openTeam(F.team); });
  setInterval(() => { if (document.visibilityState === "visible" && !frame) load(true); }, 60e3);
  setInterval(renderNote, 15e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !frame) load(true); });
})();
</script>
</body>
</html>
