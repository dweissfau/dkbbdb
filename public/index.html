<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dkbbdb</title>
<meta name="description" content="DraftKings best ball leaderboard, scored live: filter by tournament, username or player, and open any team's league and roster.">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="bar">
  <a class="brand" href="/">dkbbdb</a>
  <div class="spacer"></div>
  <a class="btn primary" href="/connect">Add your teams</a>
</div>
<main>
  <div class="filters">
    <select id="fT" aria-label="Tournament"><option value="">All tournaments</option></select>
    <form class="find" id="fU" autocomplete="off">
      <input type="search" placeholder="Username" aria-label="DraftKings username" spellcheck="false" autocapitalize="off">
      <div class="hits" hidden></div>
    </form>
    <form class="find" id="fP" autocomplete="off">
      <input type="search" placeholder="Player" aria-label="Player" spellcheck="false">
      <div class="hits" hidden></div>
    </form>
  </div>
  <div class="active" id="active" hidden></div>
  <div class="cards" id="cards"></div>

  <div class="panel">
    <div class="head">
      <h1 id="title">Leaderboard</h1>
      <span class="note" id="count"></span>
      <div class="spacer"></div>
      <span class="note" id="liveNote"></span>
    </div>
    <div class="scroll-x">
      <table>
        <thead><tr><th></th><th>User</th><th>Tournament</th><th class="num col-buyin">Buy-in</th><th class="col-place">League place</th><th class="num">Points</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="more" id="more" hidden><button class="btn" id="moreBtn">Show more</button></div>
  </div>
  <footer>Independent tool — not affiliated with, endorsed by, or sponsored by DraftKings. DraftKings is a trademark of its owner.</footer>
</main>
<script src="/site.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pts = (n) => n == null ? "—" : Number(n).toFixed(2); // DraftKings shows fantasy points to the cent
  const pct = (a, b) => b ? `${(100 * a / b).toFixed(1)}%` : "—";
  const agoTxt = (iso) => { const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : `${(s / 3600).toFixed(1)} h ago`; };
  const PAGE = 100;

  // filters live in the address (?t=&u=&p=) so a filtered leaderboard can be shared or bookmarked
  const sp = new URLSearchParams(location.search);
  const F = { t: sp.get("t") ?? "", u: sp.get("u") ?? "", p: sp.get("p") ?? "" };
  let data = null, rows = [], shown = PAGE;

  const url = (offset, limit) => "/api/leaderboard?" + new URLSearchParams({ ...Object.fromEntries(Object.entries(F).filter(([, v]) => v)), offset, limit });
  function pushState() {
    const q = new URLSearchParams(Object.entries(F).filter(([, v]) => v)).toString();
    history.replaceState(null, "", q ? "/?" + q : "/");
  }

  function render() {
    if (!data?.live) { $("rows").innerHTML = `<tr><td colspan="6" class="empty">Scores are unavailable right now — try again in a minute.</td></tr>`; return; }
    const f = data.filter, s = data.stats;

    // tournament dropdown
    const sel = $("fT"), want = F.t;
    sel.replaceChildren(new Option("All tournaments", ""), ...data.tournaments.map((t) => new Option(`${t.name} (${t.teams.toLocaleString()})`, t.name)));
    sel.value = want;

    // active username / player filters
    const chips = [];
    if (f.u) chips.push(`<span class="tag">${esc(f.u)}<button data-clear="u" aria-label="Clear username">✕</button></span><a class="sub" href="/u/${encodeURIComponent(f.u)}">full portfolio: exposure, balance →</a>`);
    for (const p of f.p) chips.push(`<span class="tag"><b class="pos ${esc(p.pos)}">${esc(p.pos)}</b>${esc(p.name)} <i>${esc(p.team ?? "")}</i><button data-clear="p" data-id="${p.id}" aria-label="Remove ${esc(p.name)}">✕</button></span>`);
    if (f.p.length && f.p.length < 5) chips.push(`<span class="sub" style="color:var(--muted)">add another player to see teams with ${f.p.length === 1 ? "both" : "all of them"}</span>`);
    $("active").innerHTML = chips.join(""); $("active").hidden = !chips.length;

    // summary cards: the player's numbers against the field he is measured in (tournament / username filters)
    const fieldRate = pct(s.fieldAdvancing, s.fieldRanked);
    const np = f.p.length, them = np === 1 ? "him" : np === 2 ? "both" : `all ${np}`;
    const names = np ? f.p.map((p) => p.name).join(" + ") : "";
    const cards = np
      ? [[`Teams with ${them}`, s.count.toLocaleString(), `of ${s.field.toLocaleString()} team${s.field === 1 ? "" : "s"}${f.t ? " in this tournament" : ""}${f.u ? ` of ${f.u}` : ""}`],
         ["Ownership", pct(s.count, s.field), `share of those teams that drafted ${them}`],
         ["Advance rate", pct(s.advancing, s.ranked), `all teams: ${fieldRate}`],
         ["Advancing", s.advancing.toLocaleString(), `of the ${s.count.toLocaleString()} team${s.count === 1 ? "" : "s"} with ${them} are inside the cutoff now`]]
      : [["Teams", s.count.toLocaleString(), f.u ? `synced by ${f.u}` : `from ${data.accounts.toLocaleString()} account${data.accounts === 1 ? "" : "s"}`],
         ["Advancing", s.advancing.toLocaleString(), "inside their league's cutoff now"],
         ["Advance rate", fieldRate, "of teams with a league place"]];
    $("cards").innerHTML = cards.map(([k, v, d]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join("");

    $("title").textContent = np ? `Teams with ${names}` : f.u ? `${f.u}'s teams` : "Leaderboard";
    $("count").textContent = `${data.total.toLocaleString()} team${data.total === 1 ? "" : "s"} · season points`;
    $("rows").innerHTML = rows.map((t) => `<tr data-id="${esc(t.id)}" tabindex="0">
      <td class="rk num">${t.n}</td>
      <td class="user"><button class="ulink" data-user="${esc(t.user)}" title="Show only ${esc(t.user)}'s teams">${esc(t.user)}</button></td>
      <td class="contest">${esc(t.contest)}</td>
      <td class="num col-buyin">${t.buyIn == null ? "—" : "$" + t.buyIn.toLocaleString()}</td>
      <td class="col-place">${t.rank ?? "—"} / ${t.entrants ?? "—"}${t.adv ? `<span class="chip">Advancing</span>` : ""}</td>
      <td class="num"><b>${pts(t.points)}</b></td></tr>`).join("")
      || `<tr><td colspan="6" class="empty">${f.u && !np ? `No synced teams under “${esc(f.u)}” yet — <a href="/connect">add your teams</a>.` : "No teams match."}</td></tr>`;
    $("more").hidden = rows.length >= data.total;
    renderNote();
  }
  function renderNote() {
    if (!data?.at) return;
    $("liveNote").innerHTML = `<span class="live"><span class="dot"></span>${data.playing ? "games on" : "live scoring"} · updated ${agoTxt(data.at)}</span>`;
  }

  // reload = the rows on screen again (after a filter change only the first page)
  async function load(keepShown = false) {
    if (!keepShown) shown = PAGE;
    try {
      const d = await (await fetch(url(0, Math.min(200, shown)))).json();
      data = d; rows = d.rows ?? [];
      // pages beyond the first 200 are fetched in order
      while (d.live && rows.length < Math.min(shown, d.total)) rows.push(...(await (await fetch(url(rows.length, 200))).json()).rows);
      render();
    } catch { if (!data) $("rows").innerHTML = `<tr><td colspan="6" class="empty">Could not load the leaderboard — check your connection.</td></tr>`; }
  }
  const setFilter = (k, v) => { F[k] = v; pushState(); load(); window.scrollTo({ top: 0 }); };

  $("fT").addEventListener("change", (e) => setFilter("t", e.target.value));
  window.dkbbSuggest($("fU"), "user", (r) => setFilter("u", r.username));
  // players add up: each pick narrows the table to teams that have ALL of them (at most 5)
  const pids = () => F.p.split(",").filter(Boolean);
  window.dkbbSuggest($("fP"), "player", (r) => setFilter("p", [...new Set([...pids(), String(r.id)])].slice(0, 5).join(",")));
  $("active").addEventListener("click", (e) => {
    const b = e.target.closest("[data-clear]"); if (!b) return;
    setFilter(b.dataset.clear, b.dataset.id ? pids().filter((id) => id !== b.dataset.id).join(",") : "");
  });
  $("moreBtn").addEventListener("click", () => { shown += PAGE; load(true); });

  // a row opens that team's league view — the same pop-up as on the portfolio pages (boot.js team mode)
  let frame = null;
  function openTeam(id) {
    closeTeam();
    frame = document.createElement("iframe");
    frame.className = "teamframe"; frame.title = "Team"; frame.src = "/team/" + encodeURIComponent(id);
    document.body.appendChild(frame);
    document.documentElement.style.overflow = "hidden";
  }
  function closeTeam() { frame?.remove(); frame = null; document.documentElement.style.overflow = ""; }
  window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data?.dkbbdb === "close-team") closeTeam(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeTeam(); });
  $("rows").addEventListener("click", (e) => {
    const u = e.target.closest("[data-user]");
    if (u) { setFilter("u", u.dataset.user); return; }
    const tr = e.target.closest("tr[data-id]"); if (tr) openTeam(tr.dataset.id);
  });
  $("rows").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.matches("tr[data-id]")) openTeam(e.target.dataset.id); });

  load();
  setInterval(() => { if (document.visibilityState === "visible" && !frame) load(true); }, 60e3);
  setInterval(renderNote, 15e3);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !frame) load(true); });
})();
</script>
</body>
</html>
