# Scores dkbbdb's board off the site (scripts/score.mjs) and hands it to https://dkbbdb.com/api/board.
# Schedules are UTC. Windows cover NFL game time in Eastern time with an hour to spare for daylight saving:
#   Sunday 1 pm – midnight ET       every 5 min      (17:00–23:59 UTC Sun + 00:00–04:59 UTC Mon)
#   Sunday / Monday / Thursday night games            (00:00–04:59 UTC Mon / Tue / Fri)
#   every day 6 am ET                                 (stat corrections, the morning board)
# A run costs about a minute of Actions time; a private repo has 2,000 free minutes a month, a public one unlimited.
# The only secret is CRON_SECRET (the site's); the job pulls the league file from the site and posts the board back.
name: score
on:
  schedule:
    - cron: "*/5 17-23 * * 0"
    - cron: "*/5 0-4 * * 1"
    - cron: "*/5 0-4 * * 2"
    - cron: "*/5 0-4 * * 5"
    - cron: "0 10 * * *"
  workflow_dispatch:
concurrency:
  group: score
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      # the finished-week totals (~3 MB) are kept between runs; a new entry is saved once a day
      - uses: actions/cache@v4
        with:
          path: .blob/store/prior.json.gz
          key: prior-v1-${{ github.run_id }}
          restore-keys: prior-v1-
      - run: node scripts/score.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DKBBDB_SITE: ${{ vars.DKBBDB_SITE || 'https://dkbbdb.com' }}
